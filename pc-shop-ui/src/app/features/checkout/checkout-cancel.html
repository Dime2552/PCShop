<div class="max-w-xl mx-auto py-12 px-4">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 sm:p-12 text-center">
    <div class="w-20 h-20 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-6">
      <i class="pi pi-times-circle text-5xl"></i>
    </div>

    <h1 class="text-3xl font-bold text-gray-900 mb-3">Payment Cancelled</h1>
    <p class="text-gray-600 mb-8 leading-relaxed">
      Your checkout session was cancelled and no charges were made. You can review your cart items and try checking out again whenever you're ready.
    </p>

    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <p-button
        label="Back to Cart"
        icon="pi pi-shopping-cart"
        routerLink="/cart"
        styleClass="w-full sm:w-auto px-6 py-3 font-semibold">
      </p-button>
      <p-button
        label="Back to Catalog"
        icon="pi pi-arrow-left"
        routerLink="/"
        severity="secondary"
        styleClass="w-full sm:w-auto px-6 py-3 font-semibold">
      </p-button>
    </div>
  </div>
</div>
